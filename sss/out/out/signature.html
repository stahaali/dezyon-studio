<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dezyon Studio Email Signature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background-color: #ffffff;
        font-family: "Lexend", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!--
      Email signature — copy the table below into your email client.
      For sent emails, use logo: https://dezyonstudio.com/assets/img/logo-black01.webp
    -->
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      role="presentation"
      style="
        width: auto;
        border-collapse: collapse;
        background-color: transparent;
      "
    >
      <tr>
        <td style="padding: 12px 14px; background-color: transparent;">
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            role="presentation"
            style="
              font-family: 'Lexend', system-ui, sans-serif;
              font-size: 14px;
              line-height: 1.5;
              color: #000200;
              border-collapse: collapse;
              width: auto;
            "
          >
            <tr>
              <td valign="middle" style="padding: 0 14px 0 0; vertical-align: middle;">
                <img
                  src="assets/img/logo-black01.webp"
                  alt="Dezyon Studio"
                  width="160"
                  height="45"
                  style="display: block; border: 0; outline: none; text-decoration: none;"
                />
              </td>
              <td
                valign="top"
                style="
                  padding: 0 0 0 14px;
                  vertical-align: top;
                  border-left: 1px solid #000200;
                  font-family: 'Lexend', system-ui, sans-serif;
                "
              >
                <p style="margin: 0 0 8px; font-family: 'Lexend', system-ui, sans-serif; font-size: 16px; font-weight: 700; color: #000200;">
                  Ava Parker
                </p>
                <p style="margin: 0 0 4px; font-family: 'Lexend', system-ui, sans-serif; color: #000200;">
                  <strong style="color: #000200; font-weight: 700;">Phone (USA):</strong>
                  <a href="tel:+13464212554" style="color: #000200; text-decoration: none; font-weight: 400;">+1 346-421-2554</a>
                </p>
                <p style="margin: 0 0 4px; font-family: 'Lexend', system-ui, sans-serif; color: #000200;">
                  <strong style="color: #000200; font-weight: 700;">Web:</strong>
                  <a href="https://dezyonstudio.com/" style="color: #000200; text-decoration: none; font-weight: 400;">dezyonstudio.com</a>
                </p>
                <p style="margin: 0 0 4px; font-family: 'Lexend', system-ui, sans-serif; color: #000200;">
                  <strong style="color: #000200; font-weight: 700;">Email:</strong>
                  <a href="mailto:hello@dezyonstudio.com" style="color: #000200; text-decoration: none; font-weight: 400;">hello@dezyonstudio.com</a>
                </p>
                <p style="margin: 0 0 8px; font-family: 'Lexend', system-ui, sans-serif; font-weight: 400; color: #000200;">
                  <strong style="color: #000200; font-weight: 700;">USA:</strong>
                  17418 Moreton Ln, Spring, TX 77379
                </p>
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  role="presentation"
                  style="border-collapse: collapse; margin: 0;"
                >
                  <tr>
                    <td style="padding: 0 5px 0 0;">
                      <a href="https://www.facebook.com/dezyonstudios/" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none;" aria-label="Facebook">
                        <img src="assets/img/marketing/tools/facebook.svg" alt="Facebook" width="26" height="26" style="display: block; border: 0;" />
                      </a>
                    </td>
                    <td style="padding: 0 5px 0 0;">
                      <a href="https://www.linkedin.com/company/dezyon-studio/" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none;" aria-label="LinkedIn">
                        <img src="assets/img/marketing/tools/linkedin.svg" alt="LinkedIn" width="26" height="26" style="display: block; border: 0;" />
                      </a>
                    </td>
                    <td style="padding: 0 5px 0 0;">
                      <a href="https://www.instagram.com/dezyon.studio/" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none;" aria-label="Instagram">
                        <img src="assets/img/marketing/tools/instagram.svg" alt="Instagram" width="26" height="26" style="display: block; border: 0;" />
                      </a>
                    </td>
                    <td style="padding: 0 5px 0 0;">
                      <a href="https://www.tiktok.com/@dezyonstudio" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none;" aria-label="TikTok">
                        <img src="assets/img/marketing/tools/tiktok.svg" alt="TikTok" width="26" height="26" style="display: block; border: 0;" />
                      </a>
                    </td>
                    <td style="padding: 0;">
                      <a href="https://www.youtube.com/@dezyonstudio" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none;" aria-label="YouTube">
                        <img src="assets/img/marketing/tools/youtube.svg" alt="YouTube" width="26" height="26" style="display: block; border: 0;" />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
